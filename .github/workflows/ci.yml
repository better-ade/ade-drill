name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:   # one run from a branch checks the real-bot mode before a merge
permissions: { contents: read }
jobs:
  ci:
    uses: better-ade/.github/.github/workflows/verify.yml@v1
    with: { command: "bash tests/run.sh" }
  golden:
    name: golden path (${{ matrix.os }}, ade ${{ matrix.ade || 'release' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: ubuntu-latest, ade: main }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: the real tools the drill needs
        run: bash drills/golden/ci-tools.sh
      - name: the golden path, with a stand-in for every account
        run: bash drills/golden.sh
        env:
          GOLDEN_ADE_REF: ${{ matrix.ade }}
          GOLDEN_OUT: ${{ runner.temp }}/golden
      - name: the transcripts and the first-run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-${{ matrix.os }}-${{ matrix.ade || 'release' }}
          path: ${{ runner.temp }}/golden
          if-no-files-found: warn
  raw-ubuntu:
    name: raw Ubuntu ${{ matrix.target }} (ade ${{ matrix.ade || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: server }
          - { target: desktop }
          - { target: server, ade: main }
          - { target: desktop, ade: main, record: "1" }   # also the run as a video (RAW_RECORD): no real bot here
    env:
      # the real-bot mode (story D4): only on a push or a dispatch in better-ade/ade-drill, never on a pull request, and in
      # one job only (server, ade main), so a run sends a handful of real messages
      ADE_DRILL_TELEGRAM_TOKEN: ${{ (github.event_name != 'pull_request' && github.repository == 'better-ade/ade-drill' && matrix.target == 'server' && matrix.ade == 'main') && secrets.ADE_DRILL_TELEGRAM_TOKEN || '' }}
      ADE_DRILL_TELEGRAM_CHAT: ${{ (github.event_name != 'pull_request' && github.repository == 'better-ade/ade-drill' && matrix.target == 'server' && matrix.ade == 'main') && secrets.ADE_DRILL_TELEGRAM_CHAT || '' }}
    steps:
      - name: mask the real bot's token and chat
        run: |
          [ -z "$ADE_DRILL_TELEGRAM_TOKEN" ] || echo "::add-mask::$ADE_DRILL_TELEGRAM_TOKEN"
          [ -z "$ADE_DRILL_TELEGRAM_CHAT" ] || echo "::add-mask::$ADE_DRILL_TELEGRAM_CHAT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: the video tools, on the runner (never in the person's container)
        if: matrix.record
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
      - name: the user flow on a raw Ubuntu ${{ matrix.target }}, with a stand-in for every account
        run: bash drills/raw-ubuntu.sh
        env:
          RAW_TARGET: ${{ matrix.target }}
          RAW_RECORD: ${{ matrix.record }}
          GOLDEN_ADE_REF: ${{ matrix.ade }}
          GOLDEN_OUT: ${{ runner.temp }}/raw
      - name: the report and the transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-${{ matrix.target }}-${{ matrix.ade || 'release' }}
          path: ${{ runner.temp }}/raw
          if-no-files-found: warn
      - name: the video (MP4 and poster)
        if: always() && matrix.record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ade-d4-video
          path: |
            ${{ runner.temp }}/raw/video/ade-d4.mp4
            ${{ runner.temp }}/raw/video/ade-d4.png
          if-no-files-found: error
  ui-tour:
    # the ade ui tour video (story D5): by hand only (a dispatch), never on a pull request or a push, and no secrets;
    # it drives the released ade-cli named by ADE_UI_TOUR_REF in drills/pins.sh
    name: ade ui tour video
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04   # tmux 3.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: the real tools the tour needs (tmux, the video tools, a headless browser for the web page)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux ffmpeg fonts-dejavu-core >/dev/null
          npm install --silent --prefix "$RUNNER_TEMP/pw" playwright@1.48.2
          (cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps chromium)
      - name: the tour, recorded twice and compared
        run: bash drills/ui-tour.sh
        env:
          UI_TOUR_NODE_PATH: ${{ runner.temp }}/pw/node_modules
          UI_TOUR_OUT: ${{ runner.temp }}/ui-tour
      - name: the video, its poster, captions and facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ade-ui-tour
          path: |
            ${{ runner.temp }}/ui-tour/ade-ui-tour.mp4
            ${{ runner.temp }}/ui-tour/ade-ui-tour.png
            ${{ runner.temp }}/ui-tour/ade-ui-tour.vtt
            ${{ runner.temp }}/ui-tour/ade-ui-tour.json
          if-no-files-found: error
