name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  ci:
    uses: better-ade/.github/.github/workflows/verify.yml@v1
    with: { command: "bash tests/run.sh" }
  golden:
    name: golden path (${{ matrix.os }}, ade ${{ matrix.ade || 'release' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: ubuntu-latest, ade: main, tools: chromium }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: the real tools the drill needs
        run: bash drills/golden/ci-tools.sh ${{ matrix.tools }}
      - name: the golden path, with a stand-in for every account
        run: bash drills/golden.sh
        env:
          GOLDEN_ADE_REF: ${{ matrix.ade }}
          GOLDEN_OUT: ${{ runner.temp }}/golden
      - name: the transcripts and the first-run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-${{ matrix.os }}-${{ matrix.ade || 'release' }}
          path: ${{ runner.temp }}/golden
          if-no-files-found: warn
